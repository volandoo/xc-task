name: gap-scoring-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gap-scoring-image.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "tsconfig.json"
      - "tools/gap-scoring/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gap-scoring-image.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "tsconfig.json"
      - "tools/gap-scoring/**"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xc-task-gap-scoring
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/gap-scoring/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
